SecretCreate:
  type: object
  properties:
    content:
      type: string
      example: Đây là nội dung bí mật
    password:
      type: string
      example: 123456
    is_client_encrypted:
      type: boolean
      default: false
      example: false
  required:
    - content

SecretCreated:
  type: object
  properties:
    message:
      type: string
      example: Secret created
    accessUrl:
      type: string
      example: http://localhost:3000/api/secret/42a6ff49-cs23-1312-213c-d67328a1c4f2

SecretContent:
  type: object
  properties:
    content:
      type: string 
      example: Đây là nội dung bí mật
    is_client_encrypted:
      type: boolean
      example: false

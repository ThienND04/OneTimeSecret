get:
  summary: Lấy một secret 
  tags: 
    - Secret
  parameters:
    - name: id
      in: path
      required: true
      description: ID của secret cần lấy
      schema:
        type: string
    - name: password
      in: query
      required: false
      description: Mật khẩu để truy cập secret (nếu có)
      schema:
        type: string
        example: '123456'
  responses:
    '201':
      description: Nhận Secret thành công
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/SecretContent'
    '400':
      description: 'Invalid request data'
    '401':
      description: 'Password is required to access this secret'
    '403':
      description: 'Invalid password'
    '404':
      description: 'Secret not found or already viewed'
    '410':
      description: 'Secret already viewed and destroyed'
    '500':
      description: 'Internal server error'

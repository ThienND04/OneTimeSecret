post:
  summary: Tạo một secret mới
  tags:
    - Secret
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/SecretCreate'
  responses:
    '201':
      description: Secret được tạo thành công
      content:
        application/json: 
          schema:
            $ref: '../components/schemas.yaml#/SecretCreated'
    '400':
      description: 'Invalid request data'
    '500':
      description: 'Internal server error'

